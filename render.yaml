services:
  - type: web
    name: nostradomus
    runtime: static
    buildCommand: echo "NOSTRADOMUS static site ready"
    staticPublishPath: ./public
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
  - type: web
    name: nostradomus-live-api
    runtime: node
    plan: free
    buildCommand: echo "NOSTRADOMUS live-source service ready"
    startCommand: node server.js
